name: Build Among Us Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'
        global-json-file: global.json

    - name: Restore Dependencies
      run: dotnet restore companion.csproj --configfile nuget.config

    - name: Copy GameLibs to Local Folder
      run: |
        mkdir -p libs
        # Find and copy Assembly-CSharp and UnityEngine.CoreModule from the NuGet cache
        find ~/.nuget/packages/amongus.gamelibs.steam -name "Assembly-CSharp.dll" -exec cp {} libs/ \;
        find ~/.nuget/packages/amongus.gamelibs.steam -name "UnityEngine.CoreModule.dll" -exec cp {} libs/ \;

    - name: Build Mod
      run: dotnet build companion.csproj --configuration Release --no-restore
      
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: companion-mod
        path: bin/Release/net6.0/dev.thatonedev.companion.dll
        
