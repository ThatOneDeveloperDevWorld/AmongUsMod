name: Build Companion Mod

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build Project
      run: dotnet build companion.csproj --configuration Release

    - name: Upload Compiled DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: companion-mod-dll
        path: bin/Release/netstandard2.1/dev.thatonedev.companion.dll
        
