name: Build Companion Mod

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Clear NuGet HTTP Cache
      run: dotnet nuget locals http-cache --clear

    - name: Restore Dependencies
      run: dotnet restore companion.csproj

    - name: Build Project
      run: dotnet build companion.csproj --configuration Release --no-restore

    - name: Upload Compiled DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: companion-mod-dll
        path: bin/Release/net6.0/dev.thatonedev.companion.dll
        
